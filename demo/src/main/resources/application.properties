# --- Application Configuration ---
spring.config.activate.on-profile=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SERVER_PORT:8080}
spring.application.name=${SPRING_APPLICATION_NAME:demo}

# --- Database Configuration ---
# Database type (h2 or postgresql)
# H2 persistente en archivo (los datos se guardan en ./data/sanmigueldb.mv.db)
# DB_CLOSE_DELAY=-1: mantiene la conexión abierta indefinidamente
# DB_CLOSE_ON_EXIT=FALSE: no cierra la base de datos al salir de la aplicación
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sanmigueldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:SanMiguel}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:SanMiguelDBPassword#2025*3GFEV56-SDV43}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 Console (only for dev)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=${H2_CONSOLE_PATH:/h2-console}

# --- JPA Configuration ---
# update: actualiza el esquema sin borrar datos (persistencia)
# create-drop: borra todo al cerrar (solo para desarrollo/test)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.generate-ddl=${SPRING_JPA_GENERATE_DDL:true}

# --- Upload Configuration ---
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyThatShouldBeAtLeast32CharactersLong!123}
app.jwt.expiration=${JWT_EXPIRATION:86400000}